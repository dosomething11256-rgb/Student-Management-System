services:

  web:
    build: .
    container_name: student-management-app
    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: student_db

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: student-management-db

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: student_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  mysql_data: